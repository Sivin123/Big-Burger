  <header>

    <h1>Big Burger</h1>

    <input id="hamburger_checkbox" type="checkbox">

    <label for="hamburger_checkbox" id="hamburger_menu">

      <img id="hamburger_icon" src="images/sk-uVPV_nV17Tw-unsplash.jpg" alt="Menu" width="24" height="18">

      <span class="sr-only">Place To Eat</span>
    </label>

    <nav>

      <a href="index.html">Home</a>

      <a href="gallery.html">Photo</a>

      <a class="active_nav" href="contact.html">Contact</a>
    </nav>

  <form>

      <h2>Join the member of Big Burger</h2>

      <label for="name">Name:</label>
      <input type="text" id="name" name="name" placeholder="Your Name"><br>

      <label for="email">Email:</label>
      <input type="email" id="email" name="email" placeholder="yourname@gmail.com"><br>

      <label for="message">Message:</label>
      <textarea id="message" name="message" rows="5" placeholder="Your Message to Big Burger"></textarea><br>

      <input type="submit" value="Send">
  </form>

  <footer>
    <p>Mr.No Body</p>
  </footer>
